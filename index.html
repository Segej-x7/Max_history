<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#2a6d5d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Исторические даты</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./Zastavka.png">
    <link rel="apple-touch-icon" href="./Zastavka.png">
    <style>
        :root {
            --primary-color: #2a6d5d;
            --secondary-color: #4a8c7c;
            --accent-color: #6baa9a;
            --bg-color: #f0f5f3;
            --card-color: #ffffff;
            --text-color: #2a3a35;
            --border-radius: 12px;
            --shadow: 0 4px 12px rgba(42, 109, 93, 0.2);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 16px;
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background-color: var(--card-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 30px;
            width: 100%;
            text-align: center;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .subtitle {
            color: var(--text-color);
            opacity: 0.8;
            font-size: 1rem;
        }
        
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 30px;
        }
        
        .nav-link {
            display: block;
            padding: 18px;
            background-color: var(--primary-color);
            color: white;
            border-radius: var(--border-radius);
            text-decoration: none;
            font-weight: 500;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }
        
        .nav-link:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }
        
        .description {
            margin-top: 20px;
            color: var(--text-color);
            opacity: 0.7;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Исторические даты</h1>
            <p class="subtitle">Изучайте и повторяйте</p>
        </header>
        
        <div class="links-container">
            <a href="index_test.html" class="nav-link">Тесты</a>
            <a href="index_questions.html" class="nav-link">Вопросы</a>
        </div>
        
        <p class="description">
            Выберите раздел для продолжения работы с приложением
        </p>
    </div>
</body>
</html>
